[project]
name = "langgraph-udemy-course"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "langchain>=1.4.3",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-core>=1.6.5",
    "langchain-openai>=1.6.6",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langsmith>=0.14.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.1.1",
    "sqlalchemy-utils>=0.42.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "mypy>=2.3.1",
    "nbconvert>=7.17.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
